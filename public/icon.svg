<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50"/>
      <stop offset="100%" style="stop-color:#1a252f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFA500"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Large uncle (Buddha) -->
  <circle cx="256" cy="280" r="120" fill="url(#gold)" stroke="#B8860B" stroke-width="8"/>

  <!-- Face features -->
  <circle cx="220" cy="260" r="12" fill="#333"/>
  <circle cx="292" cy="260" r="12" fill="#333"/>
  <ellipse cx="256" cy="310" rx="30" ry="15" fill="#333"/>

  <!-- Small uncles -->
  <circle cx="120" cy="380" r="40" fill="#F5DEB3" stroke="#DEB887" stroke-width="4"/>
  <circle cx="392" cy="380" r="40" fill="#FFE4B5" stroke="#DEB887" stroke-width="4"/>

  <!-- Halo rays -->
  <g fill="#FFD700" opacity="0.6">
    <rect x="248" y="100" width="16" height="40" rx="8"/>
    <rect x="248" y="100" width="16" height="40" rx="8" transform="rotate(45 256 280)"/>
    <rect x="248" y="100" width="16" height="40" rx="8" transform="rotate(90 256 280)"/>
    <rect x="248" y="100" width="16" height="40" rx="8" transform="rotate(135 256 280)"/>
    <rect x="248" y="100" width="16" height="40" rx="8" transform="rotate(180 256 280)"/>
    <rect x="248" y="100" width="16" height="40" rx="8" transform="rotate(225 256 280)"/>
    <rect x="248" y="100" width="16" height="40" rx="8" transform="rotate(270 256 280)"/>
    <rect x="248" y="100" width="16" height="40" rx="8" transform="rotate(315 256 280)"/>
  </g>

  <!-- Text -->
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">OJI</text>
</svg>
